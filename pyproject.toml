[project]
name = "sdth-nexus-c2"
version = "0.1.0"
description = "SDTH C2 app powered by NexusGate core (Phase 1: colocated Python)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
sdth-nexus-c2 = "app.main:cli_main"
sdth-mock-effector = "app.mock_server:cli_main"
sdth-mock-clearbot = "app.mock_server:cli_main"
sdth-mock-glint = "app.mock_glint_server:cli_main"
sdth-c2-server = "app.c2_server:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "app"]

[tool.hatch.build.targets.wheel.force-include]
"app/config/maritime_defense_policy.yaml" = "app/config/maritime_defense_policy.yaml"
"app/templates" = "app/templates"
"app/static/verify" = "app/static/verify"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end / multi-component checks (C2 REST, live servers)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "core", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter / readability
]

[tool.mypy]
python_version = "3.13"
packages = ["app", "core"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "types-PyYAML>=6.0.12",
]
# Local / venue LiteLLM proxy (not in CI). uv sync --group litellm
litellm = [
    "litellm[proxy]>=1.76.0",
]
