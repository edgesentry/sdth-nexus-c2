name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check app core tests

      - name: Ruff format
        run: uv run ruff format --check app core tests

      - name: Mypy
        run: uv run mypy

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Dependency audit
        run: uv audit --locked

      - name: Bandit
        run: uv run bandit -r app core -c pyproject.toml -q

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install eds + libedgesentry_bridge (v0.2.3)
        run: ./scripts/ci_install_eds.sh

      - name: Pytest (unit)
        run: uv run pytest tests/unit/ -q
        env:
          EDS_BRIDGE_LIB: ${{ env.EDS_BRIDGE_LIB }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install eds + libedgesentry_bridge (v0.2.3)
        run: ./scripts/ci_install_eds.sh

      - name: Pytest (integration)
        run: uv run pytest tests/integration/ -v -m integration
        env:
          EDS_BRIDGE_LIB: ${{ env.EDS_BRIDGE_LIB }}

  benchmark:
    name: Slide 11 benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install eds + libedgesentry_bridge (v0.2.3)
        run: ./scripts/ci_install_eds.sh

      - name: Run operational benchmarks
        run: uv run python scripts/benchmark.py
        env:
          EDS_BRIDGE_LIB: ${{ env.EDS_BRIDGE_LIB }}

  streamer:
    name: Temporal streamer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run 19-step streamer (fast)
        run: uv run python scripts/stream_events.py --scenario S2_osint_swarm --fast --no-coa

  container:
    name: C2 container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t sdth-c2-core:ci .

      - name: Smoke /health
        run: |
          docker run -d --name c2 -p 127.0.0.1:8080:8080 sdth-c2-core:ci
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/health
          curl -sf http://127.0.0.1:8080/api/ontology/state >/dev/null
          docker stop c2

