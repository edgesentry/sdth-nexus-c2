# LiteLLM proxy — OpenAI-compatible :4000 for sdth-c2-server.
# No Postgres: demo-fidelity front door only (Phase 2). Agent Router is Phase 5.
#
#   cp deploy/litellm/.env.example deploy/litellm/.env
#   docker compose -f deploy/litellm/docker-compose.yml up -d
#   ./scripts/litellm_interpret_smoke.sh

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: sdth-nexus-litellm
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      VLLM_API_BASE: ${VLLM_API_BASE:-http://host.docker.internal:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-sk-vllm-local}
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
